
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 35px;
            color: #263247;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #243b64;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 6px;
            box-sizing: border-box;
            width: 100%;
        }

        button {
            background: #3158a6;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #243f7c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #e2e7ef;
        }

        th {
            background: #edf2fa;
        }

        .delete {
            color: #c62828;
            text-decoration: none;
        }

        .delete:hover {
            text-decoration: underline;
        }

        .message {
            color: #187344;
            margin: 15px 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Employee Management System</h1>
    <p>Manage your employee records in one place.</p>

    <!-- Success message -->
    <p class="message"
       th:if="${message}"
       th:text="${message}">
    </p>

    <!-- Add Employee Form -->
    <div class="card">
        <h2>Add Employee</h2>

        <form th:action="@{/employees/save}"
              th:object="${employee}"
              method="post">

            <div class="form-grid">

                <input type="text"
                       th:field="*{name}"
                       placeholder="Employee name"
                       aria-label="Employee name"
                       required>

                <input type="email"
                       th:field="*{email}"
                       placeholder="Email address"
                       aria-label="Email address"
                       required>

                <input type="text"
                       th:field="*{department}"
                       placeholder="Department"
                       aria-label="Department"
                       required>

                <input type="number"
                       th:field="*{salary}"
                       placeholder="Salary"
                       aria-label="Salary"
                       min="0"
                       step="0.01"
                       required>

            </div>

            <button type="submit">Save Employee</button>
        </form>
    </div>

    <!-- Employee Records Table -->
    <div class="card">
        <h2>Employee Records</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.salary}"></td>

                    <td>
                        <a class="delete"
                           th:href="@{/employees/delete/{id}(id=${emp.id})}"
                           onclick="return confirm('Are you sure you want to delete this employee?');">
                            Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6">
                        No employees added yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>

</html>
